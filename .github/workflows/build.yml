name: Deploy Standalone Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build and Inject Entry Routing
        run: |
          echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.ico"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LEMSA Pharmacy Management System</title></head><body><div id="root"></div><script type="module" src="/src/start.ts"></script></body></html>' > index.html
          npm run build || true

      - name: Setup Redirection Rules
        run: |
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.ico"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LEMSA Pharmacy Management System</title></head><body><div id="root"></div><script type="module" src="/src/start.ts"></script></body></html>' > dist/index.html
          fi
          cp dist/index.html dist/404.html

      - name: Upload Static Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to Live Site
        id: deployment
        uses: actions/deploy-pages@v4
