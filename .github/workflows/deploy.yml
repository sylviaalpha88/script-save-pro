name: 🚀 Build and Deploy LEMSA Pharmacy System

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Bun Engine
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ⚙️ Install Core Project Dependencies
        run: bun install

      - name: 🏗️ Compile and Build Production Distribution (dist)
        run: bun run build

      - name: 🌐 Deploy Assets Directly to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
